<mat-sidenav-container class="h-screen bg-gray-100 dark:bg-gray-900">
  <!-- Sidenav Menu -->
  <mat-sidenav #sidenav mode="over" [opened]="isSidenavOpen()" (openedChange)="isSidenavOpen.set($event)"
    class="bg-white dark:bg-gray-800 shadow-lg text-gray-800 dark:text-gray-200 w-64 p-4">
    <div class="flex items-center justify-between p-4 mb-4 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-xl font-semibold">Menú</h2>
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <nav class="space-y-2">
      <a href="#" class="flex items-center space-x-3 px-4 py-2 rounded-lg transition-colors
            hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-gray-700 dark:hover:text-blue-400">
        <mat-icon>home</mat-icon>
        <span>Página principal</span>
      </a>
    </nav>
    <nav class="space-y-2">
      <a href="/buildings" class="flex items-center space-x-3 px-4 py-2 rounded-lg transition-colors
            hover:bg-blue-100 hover:text-blue-600 dark:hover:bg-gray-700 dark:hover:text-blue-400">
        <mat-icon>apartment</mat-icon>
        <span>Gestionar Inmuebles</span>
      </a>
    </nav>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content>
    <!-- Toolbar/Header -->
    <mat-toolbar class="bg-blue-600 dark:bg-blue-800 text-white shadow-md">
      <button mat-icon-button (click)="toggleSidenav()" class="lg:hidden">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="text-xl font-bold ml-2">Inmobiliaria APP</span>
      <span class="flex-grow"></span>
      <!-- <div class="hidden lg:flex items-center space-x-4">
        <button mat-icon-button aria-label="Notifications">
          <mat-icon>notifications</mat-icon>
        </button>
        <button mat-icon-button aria-label="User account">
          <mat-icon>account_circle</mat-icon>
        </button>
      </div> -->
    </mat-toolbar>
    <!-- page content -->
    <div>
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
