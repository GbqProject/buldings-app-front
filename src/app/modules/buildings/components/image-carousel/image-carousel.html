<div class="relative w-full max-w-3xl mx-auto">
  <!-- Image -->
  <img
    [src]="images[currentIndex]"
    alt="carousel image"
    class="w-full h-64 object-cover rounded-2xl shadow-md transition-all duration-500"
  />

  <!-- Left Button -->
  <button
    mat-icon-button
    (click)="prev()"
    class="!absolute !left-2 !top-1/2 -translate-y-1/2 !m-0 !p-0 flex items-center justify-center bg-white/70 hover:bg-white rounded-full shadow"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  <!-- Right Button -->
  <button
    mat-icon-button
    (click)="next()"
    class="!absolute !right-2 !top-1/2 -translate-y-1/2 !m-0 !p-0 flex items-center justify-center bg-white/70 hover:bg-white rounded-full shadow"
  >
    <mat-icon>chevron_right</mat-icon>
  </button>

  <!-- Indicators -->
  <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2">
    <button
      *ngFor="let img of images; let i = index"
      (click)="currentIndex = i"
      class="w-3 h-3 rounded-full"
      [class.bg-white]="i === currentIndex"
      [class.bg-white/50]="i !== currentIndex"
    ></button>
  </div>
</div>
