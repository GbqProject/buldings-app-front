<div class="py-10 px-10 lg:px-50">
  <div class="text-3xl md:text-4xl font-semibold text-blue-600 dark:text-blue-400 mb-2">Gestionar Inmuebles</div>
  <div class="text-sm">Gestiona tus inmuebles de forma sencilla. Busca propiedades, agrega nuevas y administra las que
    ya posees.</div>
  <div class="flex items-end justify-end">
    <button (click)="openDialog()" mat-flat-button color="primary">
      Agregar
    </button>
  </div>
  <div class="flex mt-4 gap-4">
    <div class="w-100">
      <app-buildings-filters (filterData)="filterBuildings($event)"></app-buildings-filters>
    </div>
    <div class="w-full grid sm:grid-cols-1 md:grid-cols-1 lg:grid-cols-2  gap-6">
      @for (item of buildings; track item.id) {
        <app-building-card [item]="item" (clickUpdate)="openDialog(item)" (clickDelete)="delete(item.id)"></app-building-card>
      } @empty {
        <div>No hay registros para mostrar</div>
      }
    </div>
  </div>

</div>
